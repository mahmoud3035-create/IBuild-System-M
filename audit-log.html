<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل العمليات</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9;color:#0f172a}.sidebar{position:fixed;right:0;top:0;width:260px;height:100vh;background:#0f172a;color:#fff;padding:18px;display:flex;flex-direction:column}.logo{text-align:center;padding:10px 0 18px;border-bottom:1px solid #334155}.logo h1{margin:0}.logo span{color:#3b82f6}.logo p{color:#94a3b8;font-size:12px}.menu{overflow:auto;margin-top:14px;padding-bottom:70px}.menu a{display:block;color:#cbd5e1;text-decoration:none;padding:10px;border-radius:8px;margin-bottom:3px}.menu a:hover,.menu a.active{background:#2563eb;color:#fff}.logout{position:absolute;bottom:18px;left:18px;right:18px;background:#172033;color:#fff;border:1px solid #475569;border-radius:9px;padding:10px;cursor:pointer}.main{margin-right:260px;padding:30px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:right;vertical-align:top}th{background:#f8fafc}.details{white-space:pre-wrap;word-break:break-word;color:#475569;font-size:12px}.muted{color:#64748b}@media(max-width:800px){.sidebar{width:76px;padding:10px}.logo h1,.logo p,.menu span{display:none}.menu a{text-align:center;font-size:19px}.logout{font-size:0;left:8px;right:8px}.main{margin-right:76px;padding:15px}}
</style></head><body><aside class="sidebar"><div class="logo"><h1>IBuild <span>System</span></h1><p>نظام إدارة الشركة</p></div><nav class="menu"><a href="/dashboard">🏠 <span>لوحة التحكم</span></a><a href="/employees">👥 <span>الموظفين</span></a><a href="/attendance">🕐 <span>الحضور والانصراف</span></a><a href="/payroll">💰 <span>الرواتب</span></a><a href="/invoices">📄 <span>الفواتير</span></a><a href="/payments">💳 <span>المدفوعات</span></a><a href="/projects">🏗️ <span>المشاريع</span></a><a href="/reports">📊 <span>التقارير</span></a><a href="/users">🔐 <span>المستخدمون</span></a><a class="active" href="/audit-log">📝 <span>سجل العمليات</span></a><a href="/settings">⚙️ <span>الإعدادات</span></a></nav><button class="logout" onclick="logout()">🚪 تسجيل الخروج</button></aside><main class="main"><div class="card"><h2>📝 سجل العمليات</h2><p class="muted">آخر العمليات المهمة داخل النظام مع تفاصيل واضحة.</p><div style="overflow:auto;margin-top:18px"><table><thead><tr><th>التاريخ</th><th>المستخدم</th><th>العملية</th><th>القسم</th><th>رقم</th><th>التفاصيل</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>async function logout(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location='/login'}}function esc(v){return String(v??'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}function details(v){if(v==null)return '-';if(typeof v==='string'){try{return esc(JSON.stringify(JSON.parse(v),null,2))}catch{return esc(v)}}return esc(JSON.stringify(v,null,2))}async function load(){const r=await fetch('/api/audit-logs?limit=200');const d=await r.json();if(r.status===401){location='/login';return}if(!r.ok||!d.success){alert(d.message||'فشل تحميل السجل');return}document.getElementById('rows').innerHTML=(d.logs||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.username||'-')}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.entity_id||'-')}</td><td class="details">${details(x.details)}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد عمليات</td></tr>'}load()</script></body></html>
