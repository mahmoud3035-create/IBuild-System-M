<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBuild - المستخدمون</title><style>body{font-family:Arial;background:#f1f5f9;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;border:1px solid #e2e8f0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#2563eb;color:#fff;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e2e8f0}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}
.sidebar{display:flex!important;flex-direction:column!important}.menu{overflow:auto!important;max-height:calc(100vh - 150px)!important;padding-bottom:75px!important}.logout-link{position:absolute!important;bottom:18px!important;left:18px!important;right:18px!important;width:auto!important;border:1px solid #475569!important;background:#172033!important;color:#fff!important;border-radius:9px!important;padding:10px 12px!important;cursor:pointer!important;text-align:center!important;z-index:5!important}.logout-link:hover{background:#dc2626!important;color:#fff!important}
</style></head><body><div class="wrap"><div class="card"><h2>🔐 المستخدمون والصلاحيات</h2><div class="grid"><input id="name" placeholder="الاسم"><input id="username" placeholder="اسم المستخدم"><input id="password" placeholder="كلمة المرور 8 أحرف" type="password"><select id="role"><option>Admin</option><option>Manager</option><option>Accountant</option><option>HR</option><option>Viewer</option></select></div><button onclick="add()" style="margin-top:12px">إضافة مستخدم</button><p id="msg"></p></div><div class="card"><table><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>تعديل الحالة</th></tr></thead><tbody id="rows"></tbody></table></div><a href="/dashboard">لوحة التحكم</a></div><script>async function api(u,o){let r=await fetch(u,o);let j=await r.json();if(r.status===401)location='/login';return j}async function load(){let j=await api('/api/users');if(!j.success)return alert(j.message);rows.innerHTML=j.users.map(x=>`<tr><td>${x.full_name}</td><td>${x.username}</td><td>${x.role}</td><td>${x.is_active?'نشط':'موقوف'}</td><td><button onclick="toggle(${x.id},${x.is_active})">${x.is_active?'إيقاف':'تفعيل'}</button></td></tr>`).join('')}async function add(){let j=await api('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:name.value,username:username.value,password:password.value,role:role.value})});msg.textContent=j.message||'تم';if(j.success){name.value=username.value=password.value='';load()}}async function toggle(id,a){await api('/api/users/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({full_name:'',role:'Viewer',is_active:!a})});load()}load()async function logoutFromSystem(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/login'}}
</script></body></html>
