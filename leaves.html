<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBuild - الإجازات</title><style>body{font-family:Arial;background:#f1f5f9;margin:0;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:18px 22px;border-radius:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}input,select,textarea,button{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{background:#2563eb;color:#fff;cursor:pointer;border:0}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:right}.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
.sidebar{display:flex!important;flex-direction:column!important}.menu{overflow:auto!important;max-height:calc(100vh - 150px)!important;padding-bottom:75px!important}.logout-link{position:absolute!important;bottom:18px!important;left:18px!important;right:18px!important;width:auto!important;border:1px solid #475569!important;background:#172033!important;color:#fff!important;border-radius:9px!important;padding:10px 12px!important;cursor:pointer!important;text-align:center!important;z-index:5!important}.logout-link:hover{background:#dc2626!important;color:#fff!important}
</style></head><body><div class="wrap"><div class="top"><div><h2>📅 إدارة الإجازات</h2><p>طلبات الإجازات والأرصدة والموافقات</p></div><a href="/dashboard">لوحة التحكم</a></div><div class="card"><h3>طلب إجازة جديد</h3><div class="grid"><select id="employee"></select><select id="type"><option>Annual</option><option>Sick</option><option>Emergency</option><option>Other</option></select><input id="start" type="date"><input id="end" type="date"></div><textarea id="reason" placeholder="السبب / الملاحظات" style="width:100%;margin-top:12px"></textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><label>🎫 تذكرة الطيران <input id="ticket" type="file" accept=".pdf,image/*"></label><label>🧾 الإيصال <input id="receipt" type="file" accept=".pdf,image/*"></label></div><button onclick="saveLeave()" style="margin-top:12px">حفظ الطلب</button><span id="msg"></span></div><div class="card"><h3>طلبات الإجازات</h3><table><thead><tr><th>الموظف</th><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th><th>الحالة</th><th>المرفقات</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>async function api(u,o){let r=await fetch(u,o);let j=await r.json();if(r.status===401){location='/login';throw Error(j.message)}return j}async function load(){let e=await api('/api/attendance/employees');employee.innerHTML='<option value="">اختر الموظف</option>'+e.employees.map(x=>`<option value="${x.id}">${x.full_name} - ${x.employee_code||''}</option>`).join('');let j=await api('/api/leaves');rows.innerHTML=j.leaves.map(x=>`<tr><td>${x.full_name}</td><td>${x.leave_type}</td><td>${String(x.start_date).slice(0,10)}</td><td>${String(x.end_date).slice(0,10)}</td><td>${x.days}</td><td>${x.status}</td><td>${x.ticket_file_path?`<a href='${x.ticket_file_path}' target='_blank'>🎫</a>`:''} ${x.receipt_file_path?`<a href='${x.receipt_file_path}' target='_blank'>🧾</a>`:''}</td><td>${x.status==='Pending'?`<button onclick="setStatus(${x.id},'Approved')">موافقة</button> <button onclick="setStatus(${x.id},'Rejected')" style="background:#b91c1c">رفض</button>`:'—'}</td></tr>`).join('')}async function fileData(input){const f=input.files[0];if(!f)return null;return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({data:r.result,name:f.name});r.onerror=reject;r.readAsDataURL(f)})}async function saveLeave(){let j=await api('/api/leaves',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:employee.value,leave_type:type.value,start_date:start.value,end_date:end.value,reason:reason.value})});const t=await fileData(ticket),r=await fileData(receipt);if(t||r){await api('/api/leaves/'+j.leave_id+'/attachments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticket_data:t?.data,ticket_name:t?.name,receipt_data:r?.data,receipt_name:r?.name})})}msg.textContent=j.message||'';load()}async function setStatus(id,status){await api('/api/leaves/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}load(); async function logoutFromSystem(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/login'}}
</script></body></html>
