<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBuild - نهاية الخدمة</title><style>body{font-family:Arial;background:#f1f5f9;margin:0;color:#0f172a}.wrap{max-width:900px;margin:auto;padding:30px}.card{background:#fff;padding:25px;border-radius:15px;border:1px solid #e2e8f0;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr auto;gap:12px}select,button{padding:12px;border-radius:8px;border:1px solid #cbd5e1;font:inherit}button{background:#2563eb;color:#fff;border:0;cursor:pointer}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.box{padding:18px;background:#f8fafc;border-radius:10px}.num{font-size:25px;font-weight:bold;margin-top:7px}@media(max-width:650px){.stat{grid-template-columns:1fr}}
.sidebar{display:flex!important;flex-direction:column!important}.menu{overflow:auto!important;max-height:calc(100vh - 150px)!important;padding-bottom:75px!important}.logout-link{position:absolute!important;bottom:18px!important;left:18px!important;right:18px!important;width:auto!important;border:1px solid #475569!important;background:#172033!important;color:#fff!important;border-radius:9px!important;padding:10px 12px!important;cursor:pointer!important;text-align:center!important;z-index:5!important}.logout-link:hover{background:#dc2626!important;color:#fff!important}
</style></head><body><div class="wrap"><div class="card"><h2>🧮 نهاية الخدمة</h2><p>حساب تقديري لمدة الخدمة والاستحقاق اعتمادًا على الراتب الأساسي وتاريخ التعيين.</p><div class="grid"><select id="employee"></select><button onclick="calc()">احسب</button></div></div><div class="card" id="result" style="display:none"><div class="stat"><div class="box">مدة الخدمة<div class="num" id="service"></div></div><div class="box">الراتب الأساسي<div class="num" id="salary"></div></div><div class="box">الاستحقاق التقديري<div class="num" id="amount"></div></div></div><p id="note"></p></div><a href="/dashboard">العودة للوحة التحكم</a></div><script>async function api(u){let r=await fetch(u);let j=await r.json();if(r.status===401)location='/login';return j}async function load(){let j=await api('/api/attendance/employees');employee.innerHTML='<option value="">اختر الموظف</option>'+j.employees.map(x=>`<option value="${x.id}">${x.full_name}</option>`).join('')}async function calc(){if(!employee.value)return;let j=await api('/api/eos/'+employee.value);if(!j.success)return alert(j.message);result.style.display='block';service.textContent=`${j.service.years} سنة / ${j.service.months} شهر / ${j.service.days} يوم`;salary.textContent=Number(j.calculation.basic_salary).toLocaleString()+' AED';amount.textContent=Number(j.calculation.amount).toLocaleString()+' AED';note.textContent=j.calculation.note+' — '+j.calculation.formula}load();async function logoutFromSystem(){try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='/login'}}
</script></body></html>
