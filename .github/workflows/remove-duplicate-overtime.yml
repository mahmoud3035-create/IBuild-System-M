name: Remove duplicate overtime button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide first overtime button only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('payroll.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(<button\b[^>]*class=["\'][^"\']*overtime-add-btn[^"\']*["\'][^>]*>)'
          new, count = re.subn(pattern, lambda m: m.group(1) if 'display:none' in m.group(1) else m.group(1)[:-1] + ' style="display:none!important">', s, count=1)
          if count:
              p.write_text(new, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payroll.html
          git diff --cached --quiet || git commit -m "Hide duplicate top overtime button"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/remove-duplicate-overtime.yml
          git add .github/workflows/remove-duplicate-overtime.yml
          git diff --cached --quiet || git commit -m "Remove temporary overtime patch workflow"
          git push
