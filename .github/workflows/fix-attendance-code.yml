name: Fix attendance code placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove JavaScript accidentally placed inside CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('attendance.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'/\* =====================================================\s*'
              r'MONTH ARCHIVE\s*'
              r'===================================================== \*/\s*'
              r'function toggleMonthArchive\(force\).*?'
              r'/\* =====================================================\s*'
              r'MONTHLY ATTENDANCE MATRIX\s*'
              r'===================================================== \*/\s*'
              r'(?=\.monthly-attendance-card)',
              re.S,
          )

          fixed, count = pattern.subn(
              '/* =====================================================\n   MONTHLY ATTENDANCE MATRIX\n===================================================== */\n',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(f'Expected exactly one malformed CSS/JS block, found {count}')

          path.write_text(fixed, encoding='utf-8')
          print('Removed malformed JavaScript block from the <style> section.')

      - name: Syntax check JavaScript files
        run: |
          node --check server.js
          node --check payroll-enhancements.js
          node --check payroll-bridge.js
          node --check security-hardening.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Fix attendance HTML JavaScript placement"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-attendance-code.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary code-fix workflow"
            git push
          fi
