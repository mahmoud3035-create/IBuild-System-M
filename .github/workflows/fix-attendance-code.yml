name: Fix attendance code placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move month archive JavaScript out of CSS
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('attendance.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(?:/\* =====================================================\s*'
              r'MONTH ARCHIVE\s*'
              r'===================================================== \*/\s*)'
              r'(function toggleMonthArchive\(force\).*?'
              r'/\* =====================================================\s*'
              r'MONTHLY ATTENDANCE MATRIX\s*'
              r'===================================================== \*/\s*)'
              r'(?=\.monthly-attendance-card)',
              re.S,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit('Malformed MONTH ARCHIVE JavaScript block was not found.')

          js_block = match.group(1)
          replacement = '/* =====================================================\n   MONTHLY ATTENDANCE MATRIX\n===================================================== */\n'
          fixed = text[:match.start()] + replacement + text[match.end():]

          script_marker = '<script>\n'
          if script_marker not in fixed:
              raise SystemExit('Main script tag not found.')

          fixed = fixed.replace(script_marker, script_marker + js_block + '\n', 1)
          path.write_text(fixed, encoding='utf-8')
          print('Moved MONTH ARCHIVE JavaScript into the main script.')

      - name: Syntax check JavaScript
        shell: bash
        run: |
          node --check server.js
          node --check payroll-enhancements.js
          node --check payroll-bridge.js
          node --check security-hardening.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('attendance.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No script blocks found in attendance.html')
          for i, script in enumerate(scripts):
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if result.returncode:
                  print(result.stderr)
                  raise SystemExit(f'attendance.html script block {i+1} failed syntax check')
          print(f'Checked {len(scripts)} script block(s).')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attendance.html
          if git diff --cached --quiet; then
            echo "No attendance change needed."
            exit 0
          fi
          git commit -m "Fix attendance JavaScript placement"
          git push

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-attendance-code.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary attendance repair workflow"
            git push
          fi
